spring:
  application:
    name: pomodoro

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pomodoro}
    username: ${SPRING_DATASOURCE_USERNAME:pomodoro}
    password: ${SPRING_DATASOURCE_PASSWORD:pomodoro}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
