services:
  postgres:
    image: postgres:17
    container_name: pomodoro-postgres
    restart: always
    environment:
      POSTGRES_DB: pomodoro
      POSTGRES_USER: pomodoro
      POSTGRES_PASSWORD: pomodoro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pomodoro-app:
    build: .
    container_name: pomodoro-app
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pomodoro
      SPRING_DATASOURCE_USERNAME: pomodoro
      SPRING_DATASOURCE_PASSWORD: pomodoro

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pomodoro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pomodoro-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  loki:
    image: grafana/loki:3.1.0
    container_name: pomodoro-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:3.1.0
    container_name: pomodoro-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
